summary: >-
  Travel World publishes no OpenAPI, so derive-oauth-scopes.py has nothing to read; this artifact was
  PROBED from the RFC 8414 authorization-server metadata and the RFC 9728 protected-resource metadata
  the provider serves on travel.augworlds.ai. Both documents list the same six scopes. The scopes are
  MCP-resource scopes (mcp:* prefix) for the single protected resource https://travel.augworlds.ai/mcp;
  no OIDC scopes (openid/profile/email) are advertised and no scopes are attached to the A2A bearer scheme.
model: >-
  Resource-family scopes with a read/write verb suffix. The provider publishes names only — no
  per-scope descriptions exist on any public page, so the descriptions below are limited to what the
  name itself states and are marked as such.
