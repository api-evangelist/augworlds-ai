envelope:
  mcp_transport:
    media_type: application/json
    shape: '{"error":"<UPPER_SNAKE_CODE>"}'
    note: Transport-level (HTTP) error before any JSON-RPC envelope; not RFC 9457.
  a2a:
    media_type: application/json
    shape: JSON-RPC 2.0 error object {jsonrpc, error:{code, message}, id}
consistency_gap: >-
  No error reference is published. The two surfaces use different envelopes for the same condition (a
  missing bearer): the MCP endpoint returns a bare {"error":"UNAUTHORIZED"} while the A2A endpoint
  returns a JSON-RPC error with an application-defined code. Everything past authentication is
  unobservable without a member credential, so this catalog is limited to what an unauthenticated client
  will actually meet.
problem_types:
