  code: UNAUTHORIZED
  title: Unauthorized
  body: '{"error":"UNAUTHORIZED"}'
  headers:
    www-authenticate: 'Bearer resource_metadata="https://travel.augworlds.ai/.well-known/oauth-protected-resource/mcp", error="invalid_token"'
    cache-control: no-store
  remediation: Follow resource_metadata to the RFC 9728 document, register a client at the advertised authorization server, complete authorization_code + PKCE, and retry with Authorization Bearer <access_token>; or send a tvl_ personal access token.
  observed_on: POST tools/list and POST initialize without credentials
