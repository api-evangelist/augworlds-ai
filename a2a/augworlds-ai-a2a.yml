      type: httpAuthSecurityScheme
      scheme: Bearer
      description: Travel World-issued opaque ApiKey bearer token.
  skill_count: 0
  skills: []
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: null
  transport: JSONRPC (via supportedInterfaces[0].protocolBinding)
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming,
    pushNotifications and extendedAgentCard as fields. protocolVersion is present (pass), declared as
    "1.0" on supportedInterfaces[0], which is where A2A 1.0.0 carries it after supportedInterfaces[]
    replaced the 0.3-era top-level url/preferredTransport/protocolVersion triple — the same reading
    applied to leadping's card. skills is an ARRAY (pass), but an EMPTY one; see deviations. Both
    optional discriminators are present: defaultInputModes and defaultOutputModes are declared.
    preferredTransport is absent because 1.0.0 superseded it with supportedInterfaces[].protocolBinding,
    which the card declares (JSONRPC).
  deviations:
  - field: skills
    observed: empty array
    note: >-
      The public card advertises NO skills. The marketing page describes flight and hotel search, flight
      status by number, city guides and loyalty/preference-shaped results, and the OAuth metadata names
      six mcp:* scopes, but none of that is projected into the A2A card. An agent that reads only this
      card learns that Travel World exists and takes a bearer token, not what it can do. The card sets
      capabilities.extendedAgentCard true, so the skill list presumably lives on the authenticated
      extended card, which cannot be read without a member credential.
  - field: protocolVersion
    observed: carried on supportedInterfaces[0], not at the top level
    note: A reader written against A2A 0.3.0 will find no top-level protocolVersion and may misread the card as version-less. The card is consistently 1.0-shaped (supportedInterfaces, protocolBinding, the oneof-wrapped securitySchemes).
  - field: security[0].schemes.bearer.list
    observed: empty array
    note: The bearer scheme is required but no scope list is attached; the description says an opaque Travel World ApiKey, which is the tvl_ personal access token the MCP docs describe. The OAuth scopes published for the MCP resource are not referenced by the A2A card.
  - field: documentationUrl
    observed: https://travel.augworlds.ai/marketplace 307s to a member sign-in
    note: The card points at documentation that is not publicly reachable; the public, crawlable docs are at https://augworlds.ai/mcp (MCP only). robots.txt on travel.augworlds.ai disallows every crawler.
