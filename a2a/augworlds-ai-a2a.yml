agent_card:
  name: Travel World
  description: Agent-native travel platform with a ComBot marketplace.
  version: 1.0.0
  documentation_url: https://travel.augworlds.ai/marketplace
  documentation_url_status: 307 -> /api/auth/login?returnTo=%2Fagent (member sign-in; not publicly readable)
  icon_url: https://travel.augworlds.ai/favicon.ico
  provider:
    organization: Travel World
    url: https://travel.augworlds.ai
  supported_interfaces:
  - url: https://travel.augworlds.ai/a2a
    protocol_binding: JSONRPC
    protocol_version: '1.0'
  capabilities:
    streaming: true
    push_notifications: false
    extended_agent_card: true
  default_input_modes:
