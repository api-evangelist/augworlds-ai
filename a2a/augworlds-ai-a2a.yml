surface_relationship:
  note: >-
    Travel World publishes TWO agent surfaces on one host and no REST contract. A2A: a skill-less card at
    https://travel.augworlds.ai/.well-known/agent-card.json with a bearer-gated JSONRPC endpoint at
    https://travel.augworlds.ai/a2a. MCP: a remote Streamable HTTP server at https://travel.augworlds.ai/mcp
    gated by OAuth 2.1 (PKCE + dynamic client registration) or a tvl_ personal access token (see
    mcp/augworlds-ai-mcp.yml). No OpenAPI, GraphQL, AsyncAPI, gRPC or WSDL surface was found on any host.
