  refreshUrl: https://travel.augworlds.ai/api/oauth/token
  client_type: public (token_endpoint_auth_methods_supported is [none])
  scopes: scopes/augworlds-ai-scopes.yml
  applies_to:
  - https://travel.augworlds.ai/mcp
  description: >-
    The documented primary path for the MCP server. The client discovers the authorization server from the
    401's WWW-Authenticate resource_metadata, registers itself, and runs authorization_code + PKCE with a
    browser sign-in to a Travel World member account. "There is no token to copy, no --header, and nothing
    to paste into chat."
  sources:
  - https://augworlds.ai/mcp
  - https://travel.augworlds.ai/.well-known/oauth-authorization-server
  - https://travel.augworlds.ai/.well-known/oauth-protected-resource/mcp
- name: personal-access-token
  type: http
  scheme: bearer
  bearerFormat: opaque token with the tvl_ prefix
  applies_to:
  - https://travel.augworlds.ai/mcp
  description: >-
    Documented fallback for non-interactive callers (CI jobs, servers, scripts, and MCP clients without
    OAuth support such as Codex). Minted instantly by a member once inside the beta. The docs tell users to
    read it from an environment variable, never commit it, and never paste it into a chat window.
  sources:
  - https://augworlds.ai/mcp
- name: bearer
  type: http
  scheme: bearer
  bearerFormat: Travel World-issued opaque ApiKey bearer token
  applies_to:
  - https://travel.augworlds.ai/a2a
  description: >-
    The A2A agent card's sole security scheme (httpAuthSecurityScheme, scheme Bearer). An unauthenticated
    JSON-RPC POST returns 401 with error -32001 "Missing or invalid bearer token". The card attaches no
    scope list, and the OAuth scopes above are published for the MCP resource only.
  sources:
  - https://travel.augworlds.ai/.well-known/agent-card.json
credentials:
- id: oauth-access-token
  header: 'Authorization: Bearer <access_token>'
  prefix: null
  use: MCP server via OAuth 2.1 client registration + PKCE (interactive clients)
- id: personal-access-token
  header: 'Authorization: Bearer tvl_...'
  prefix: tvl_
