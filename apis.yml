apis:
  - name: Travel World MCP Server
    description: >-
      Remote Model Context Protocol server (Streamable HTTP) at https://travel.augworlds.ai/mcp. Clients authenticate
      with OAuth 2.1 — the client registers itself and runs authorization_code + PKCE with a browser sign-in — or
      with a tvl_ personal access token for CI and non-OAuth clients. Anonymous tools/list returns 401 with an RFC
      9728 resource_metadata challenge, so the tool list is not publicly introspectable; the authorization server
      publishes six mcp:* scopes (tools:list, tk:read, brandlanes:read, search:read, profile:apply, observations:write)
      and the docs describe flight and hotel search, flight status, city guides and preference-shaped results. Rate-limited
      per key with 429 + Retry-After.
    image: https://travel.augworlds.ai/favicon.ico
    humanURL: https://augworlds.ai/mcp
    baseURL: https://travel.augworlds.ai/mcp
    tags:
      - MCP
      - Travel
      - Flights
      - Hotels
      - OAuth
    properties:
      - type: MCPServer
        url: mcp/augworlds-ai-mcp.yml
      - type: MCPServer
        url: https://travel.augworlds.ai/mcp
      - type: Documentation
        url: https://augworlds.ai/mcp
      - type: OAuthScopes
        url: scopes/augworlds-ai-scopes.yml
      - type: Authentication
        url: authentication/augworlds-ai-authentication.yml
      - type: RateLimits
        url: rate-limits/augworlds-ai-rate-limits.yml
      - type: ErrorCatalog
        url: errors/augworlds-ai-problem-types.yml
  - name: Travel World A2A Agent
    description: >-
      Agent-to-Agent surface declared by the A2A 1.0 agent card at https://travel.augworlds.ai/.well-known/agent-card.json:
      a JSONRPC binding at https://travel.augworlds.ai/a2a secured by a Travel World-issued opaque ApiKey bearer
      token, with streaming on, push notifications off and an authenticated extended card. The public card advertises
      an empty skills array; an unauthenticated JSON-RPC call returns 401 (-32001 "Missing or invalid bearer token").
      The card's documentationUrl (/marketplace) redirects to member sign-in.
    image: https://travel.augworlds.ai/favicon.ico
    humanURL: https://augworlds.ai/
    baseURL: https://travel.augworlds.ai/a2a
    tags:
      - A2A
      - AI Agents
      - Travel
    properties:
      - type: AgentCard
        url: a2a/augworlds-ai-a2a.yml
      - type: AgentCard
        url: https://travel.augworlds.ai/.well-known/agent-card.json
      - type: Authentication
        url: authentication/augworlds-ai-authentication.yml
      - type: ErrorCatalog
        url: errors/augworlds-ai-problem-types.yml
