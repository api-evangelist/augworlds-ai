aid: augworlds-ai
name: Travel World
description: >-
  Travel World is the agent-native travel product of Augmented Worlds (augworlds.ai), an invite-only private beta
  in which members get a personal travel agent that searches and compares real flights and hotels, checks airline
  flight status by number, pulls city guides, and shapes results with saved loyalty programs and preferences, then
  hands checkout to the member as a Stripe Link so nothing is charged without a human present. It is exposed to
  agents as a remote MCP server gated by OAuth 2.1 (dynamic client registration + PKCE) or a tvl_ personal access
  token, and as an A2A 1.0 agent card with a bearer-gated JSON-RPC endpoint, both on travel.augworlds.ai. No REST
  contract, SDK or CLI is published; membership is free but by invitation.
